name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - name: Import check
        env:
          GROQ_API_KEY: dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
        run: python -c "import app.main"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_IRfyWE2cPFlLph4nikGWE1pS
      VERCEL_PROJECT_ID: prj_IHFO82Sg0foh0cFOVGicg5wf3if2
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel production
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify frontend is up
        run: curl -fsS https://khushtrology.vercel.app > /dev/null
      - name: Verify backend health
        run: curl -fsS https://khushtrology-production.up.railway.app/health > /dev/null
